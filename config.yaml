opts:
  kind-auth: true
  # controls installation of keysight certificates inside all nodes of the
  # kind cluster post cluster creation. Supported values:
  #   auto  - (default) probe each node's TLS trust to ghcr.io and only
  #           install certs on nodes where the probe indicates the certs
  #           are not already trusted
  #   true  - force-install certs unconditionally on every node, skipping
  #           the probe
  #   false - never install certs, skipping the probe
  kind-certs: "auto"
  # when enabled, k9s shall be installed, allowing access to
  # interactive terminal UI for managing kubernetes resources
  get-k9s: true
  check-latest-versions: true
releases:
  k9s: v0.51.0
  # used by get_kne_src() (setup_new()'s bridge flow) only. Unset/absent
  # (default) tracks kne's `main`; set to a tag/commit to pin the whole
  # bundle (kind+metallb+meshnet+manifests) to that kne release
  # kne-src: v0.3.1
  # Keep containerlab on a Docker-API-1.42-compatible release. Newer builds
  # use Docker networking features that require API v1.44+ and fail on the
  # current host daemon.
  # apt repo channel used by install_kubectl(); also reported by
  # check_latest_versions
  kubectl: v1.37
  snappi: 1.62.0
  kne: v0.1.11
# information needed to pull or load most of the container images
# used throughout script execution;
# each image shall have at least three attributes:
# - path: path to be used for container image
# - tag: tag to be used for container image
# - preload: a boolean indicating whether images shall be automatically
#           pulled inside all cluster nodes during pod creation (when false)
#           or images shall be pulled on the host (outside cluster) and
#           loaded to all cluster nodes thereafter before pod creation (when true)
images:
  keng-operator:
    path: ghcr.io/open-traffic-generator/keng-operator
    tag: 0.4.4
  keng-controller:
    # production path
    # path: ghcr.io/open-traffic-generator/keng-controller
    # alternate paths:
    # controller from internal artifactory
    path: docker-virtual-athena.artifactorylbj.it.keysight.com/keng-controller
    tag: 1.62.0-1
  ixia-c-one:

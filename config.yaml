    # path: ghcr.io/open-traffic-generator/keng-layer23-hw-server
    # alternate paths:
    # layer23-hw-server from internal artifactory
    path: docker-virtual-athena.artifactorylbj.it.keysight.com/keng-layer23-hw-server
    tag: 1.62.0-1
  keng-app-usage-reporter:
    # production path
    # path: ghcr.io/open-traffic-generator/keng-app-usage-reporter
    # alternate paths:
    # app-usage-reporter from internal artifactory
    path: docker-virtual-athena.artifactory.it.keysight.com/app-usage-reporter
    tag: 0.0.1-52
  arista-ceos:
    path: ghcr.io/open-traffic-generator/ceos
    tag: 4.33.1f
  arista-ceos-operator:
